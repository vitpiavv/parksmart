<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkSmart</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-50 text-gray-900 flex flex-col min-h-screen">

    <nav class="bg-blue-600 text-white shadow-md">
        <div class="space-x-4 flex items-center">
            <a href="/" class="hover:text-blue-200 transition">Home</a>
            {% if session.user_id %}
            <a href="/dashboard" class="hover:text-blue-200 transition">Dashboard</a>
            <span class="text-blue-200 text-sm">| Hello, {{ session.username }}</span>
            <a href="/logout"
                class="bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded-lg font-medium transition text-sm shadow-sm">Logout</a>
            {% else %}
            <a href="/login" class="hover:text-blue-200 transition">Login</a>
            <a href="/register"
                class="bg-white text-blue-600 px-4 py-1.5 rounded-lg font-semibold hover:bg-blue-50 transition shadow-sm">Register</a>
            {% endif %}
        </div>
    </nav>

    <main class="flex-grow max-w-6xl w-full mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-gray-800 text-gray-400 text-center py-4 text-sm mt-auto">
        &copy; 2026 ParkSmart. All rights reserved.
    </footer>

</body>

</html>
