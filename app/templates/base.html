<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkSmart</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-50 text-gray-900 flex flex-col min-h-screen">

   <nav class="bg-blue-600 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="/" class="text-2xl font-bold tracking-tight">🚗 ParkSmart</a>
            
            <div class="flex items-center gap-4 h-full">
                <a href="/" class="hover:text-blue-200 transition leading-none">Home</a>
                {% if session.user_id %}
                    <a href="/dashboard" class="hover:text-blue-200 transition leading-none">Dashboard</a>
                    <span class="text-blue-200 text-sm border-l border-blue-400 pl-3 py-1 h-5 flex items-center">Hello, {{ session.username }}</span>
                    <a href="/logout" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded-lg font-medium transition text-sm shadow-sm leading-none">Logout</a>
                {% else %}
                    <a href="/login" class="hover:text-blue-200 transition leading-none">Login</a>
                    <a href="/register" class="bg-white text-blue-600 px-4 py-1.5 rounded-lg font-semibold hover:bg-blue-50 transition shadow-sm leading-none">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-6xl w-full mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-gray-800 text-gray-400 text-center py-4 text-sm mt-auto">
        &copy; 2026 ParkSmart. All rights reserved.
    </footer>

</body>

</html>
