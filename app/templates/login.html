<!DOCTYPE html>
<html lang="en">
{% extends 'base.html' %}

{% block content %}
<div class="flex justify-center items-center py-12">
    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md border border-gray-100">
        <h2 class="text-3xl font-bold text-gray-900 mb-2 text-center">Welcome Back</h2>
        <p class="text-sm text-gray-500 text-center mb-6">Sign in to manage your parking spaces</p>

        <form action="{{ url_for('main.login') }}" method="POST" class="space-y-4">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input type="text" id="username" name="username" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" name="password" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            </div>

            <button type="submit" 
                class="w-full bg-blue-600 text-white font-semibold py-2.5 rounded-lg hover:bg-blue-700 transition shadow-sm mt-2">
                Sign In
            </button>
        </form>

        <p class="text-sm text-gray-600 text-center mt-6">
            Don't have an account? 
            <a href="{{ url_for('main.register') }}" class="text-blue-600 font-semibold hover:underline">Register here</a>
        </p>
    </div>
</div>
{% endblock %}
</html>
