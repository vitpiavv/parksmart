version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: parksmart_db
    restart: always
    environment:
      POSTGRES_USER: parkuser
      POSTGRES_PASSWORD: parkpassword
      POSTGRES_DB: parksmart
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parkuser -d parksmart"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parksmart_web
    restart: always
    ports:
      - "8080:8080"
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=postgresql://parkuser:parkpassword@db:5432/parksmart
      - SECRET_KEY=local-dev-secret-key
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: