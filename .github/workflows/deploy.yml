name: ParkSmart DevSecOps Continuous Deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write # Strictly required for GCP Workload Identity Federation

env:
  PROJECT_ID: 'parksmart-498918'
  REGION: 'us-central1'
  GAR_REPO: 'parksmart-repo'
  IMAGE_NAME: 'parksmart-app'
  TF_WORKING_DIR: './terraform' # Change to '.' if your TF files are in the root directory

jobs:
  deploy:
    name: Build, Scan, and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Authenticate to GCP via Workload Identity Federation
      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/913391093003/locations/global/workloadIdentityPools/parksmart-pool/providers/parksmart-provider'
          service_account: 'github-deployer@parksmart-498918.iam.gserviceaccount.com'

      # 2. NEW STEP: Fetch Secrets Natively from Google Secret Manager
      - id: 'secrets'
        name: 'Fetch Secrets from GCP Secret Manager'
        uses: 'google-github-actions/get-secretmanager-secrets@v2'
        with:
          secrets: |-
            DB_PASSWORD:projects/parksmart-498918/secrets/db-password/versions/latest
            SNYK_TOKEN:projects/parksmart-498918/secrets/snyk-token/versions/latest

      # 3. Set up Terraform CLI
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.5.7'

      # 4. Initialize Terraform
      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform

      # 5. Build the application image 
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t us-central1-docker.pkg.dev/parksmart-498918/parksmart-repo/parksmart-frontend:${{ github.sha }} .

      # 6. UPDATED STEP: Swap Trivy for Snyk Container Scan
      - name: Run Snyk to check Docker image for vulnerabilities
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ steps.secrets.outputs.SNYK_TOKEN }}
        with:
          image: us-central1-docker.pkg.dev/parksmart-498918/parksmart-repo/parksmart-frontend:${{ github.sha }}
          args: --file=Dockerfile --severity-threshold=high

      # 7. Configure Docker credential helper
      - name: Configure Docker for GCP
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      # 8. Push Image to Artifact Registry
      - name: Push Docker Image
        run: |
          docker push us-central1-docker.pkg.dev/parksmart-498918/parksmart-repo/parksmart-frontend:${{ github.sha }}

      # 9. Run Terraform using the password from Secret Manager and the dynamic container image
      - name: Terraform Apply
        run: |
          terraform apply -auto-approve \
            -var="project_id=parksmart-498918" \
            -var="db_password=${{ steps.secrets.outputs.DB_PASSWORD }}" \
            -var="container_image=us-central1-docker.pkg.dev/parksmart-498918/parksmart-repo/parksmart-frontend:${{ github.sha }}"
        working-directory: ./terraform