name: ParkSmart DevSecOps Continuous Deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write # Strictly required for GCP Workload Identity Federation

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
  REGION: 'us-central1'
  GAR_REPO: 'parksmart-repo'
  IMAGE_NAME: 'parksmart-frontend' # Consistent with your build steps
  WIF_POOL: 'parksmart-pool'
  WIF_PROVIDER: 'parksmart-provider'
  TF_WORKING_DIR: './terraform'

jobs:
  deploy:
    name: Build, Scan, and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Authenticate to GCP via Workload Identity Federation
      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ env.WIF_POOL }}/providers/${{ env.WIF_PROVIDER }}'
          service_account: 'github-deployer@${{ env.PROJECT_ID }}.iam.gserviceaccount.com'

      # 2. Fetch Secrets Natively from Google Secret Manager
      - id: 'secrets'
        name: 'Fetch Secrets from GCP Secret Manager'
        uses: 'google-github-actions/get-secretmanager-secrets@v2'
        with:
          secrets: |-
            DB_PASSWORD:projects/${{ env.PROJECT_ID }}/secrets/db-password/versions/latest
            SNYK_TOKEN:projects/${{ env.PROJECT_ID }}/secrets/snyk-token/versions/latest

      # 3. Set up Terraform CLI
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.5.7'

      # 4. Initialize Terraform
      - name: Terraform Init
        run: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}

      # 5. Build the application image 
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Using dynamic registry paths via env variables
      - name: Build Docker Image
        run: |
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .

      # 6. Swap Trivy for Snyk Container Scan
      - name: Run Snyk to check Docker image for vulnerabilities
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ steps.secrets.outputs.SNYK_TOKEN }}
        with:
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          args: --file=Dockerfile --severity-threshold=high

      # 7. Configure Docker credential helper
      - name: Configure Docker for GCP
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # 8. Push Image to Artifact Registry
      - name: Push Docker Image
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # 9. Run Terraform Apply (Inline execution to completely bypass bash multi-line parsing errors)
      - name: Terraform Apply
        run: terraform apply -auto-approve -var="project_id=${{ env.PROJECT_ID }}" -var="db_password=${{ steps.secrets.outputs.DB_PASSWORD }}" -var="container_image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
        working-directory: ${{ env.TF_WORKING_DIR }}