name: ParkSmart DevSecOps Continuous Deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write # Strictly required for GCP Workload Identity Federation

env:
  PROJECT_ID: 'parksmart-498918'
  REGION: 'us-central1'
  GAR_REPO: 'parksmart-repo'
  IMAGE_NAME: 'parksmart-app'
  TF_WORKING_DIR: './terraform' # Change to '.' if your TF files are in the root directory

jobs:
  deploy:
    name: Build, Scan, and Deploy
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout the source code
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Authenticate to Google Cloud using WIF
    - name: Authenticate to Google Cloud
      id: auth
      uses: google-github-actions/auth@v2
      with:
        token_format: 'access_token'
        workload_identity_provider: 'projects/913391093003/locations/global/workloadIdentityPools/parksmart-pool/providers/parksmart-provider'
        service_account: 'github-deployer@parksmart-498918.iam.gserviceaccount.com'

    # 3. Setup Terraform
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: '1.5.7'

    # 4. Initialize Terraform (Uses your GCS Remote State Backend)
    - name: Terraform Init
      run: terraform init
      working-directory: ${{ env.TF_WORKING_DIR }}

    # 5. Target Apply for Artifact Registry
    # This solves the "chicken-and-egg" issue by creating the container registry 
    # BEFORE we build/push the Docker image.
    - name: Infrastructure Prep (Artifact Registry Only)
      run: terraform apply -target=google_artifact_registry_repository.repo -auto-approve -var="project_id=${{ env.PROJECT_ID }}" -var="db_password=${{ secrets.DB_PASSWORD }}"
      working-directory: ${{ env.TF_WORKING_DIR }}

    # 6. Authenticate Docker to GCP Artifact Registry
    - name: Docker Auth to GCP
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGION }}-docker.pkg.dev
        username: oauth2accesstoken
        password: ${{ steps.auth.outputs.access_token }}

    # 7. Build the Docker Container locally (Tagging it with the Git Commit SHA)
    - name: Build Docker Image
      run: |
        docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .

    # 8. DevSecOps Tooling: Scan image for vulnerabilities using Aquasec Trivy
    - name: Run Trivy Vulnerability Scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: '${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}'
        format: 'table'
        exit-code: '1' # Stops the pipeline if severe vulnerabilities are found
        ignore-unfixed: true
        severity: 'CRITICAL,HIGH'

    # 9. Push the verified container to GCP Artifact Registry
    - name: Push Docker Image to GAR
      run: |
        docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

    # 10. Final Full Infrastructure Deployment
    # Deploys Cloud Run, Cloud SQL, Buckets, and updates Cloud Run to use our newly pushed image tag
    - name: Full Terraform Apply
      run: terraform apply -auto-approve -var="project_id=${{ env.PROJECT_ID }}" -var="db_password=${{ secrets.DB_PASSWORD }}" -var="image_tag=${{ github.sha }}"
      working-directory: ${{ env.TF_WORKING_DIR }}